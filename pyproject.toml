[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arke"
version = "0.1.0.dev0"
description = "AI-First Operator Description Language & Compiler Toolchain"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Arke Contributors"},
]
keywords = ["ai", "compiler", "dsl", "ir", "operator", "optimization", "gpu"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "numpy>=1.24",
    "jinja2>=3.1",
    "httpx>=0.24",
    "lark>=1.1",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "triton>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "jsonschema>=4.20",
    "numpy>=1.24",
]

# [project.scripts]
# arke = "arkec.main:cli"  # TODO: Phase 1.6

[project.urls]
Repository = "https://github.com/arke-lang/arke"
Documentation = "https://github.com/arke-lang/arke/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["arke*", "arkec*"]

[project.scripts]
arke = "arke.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "N803",   # argument name should be lowercase — we use A, B, X for tensors (math convention)
    "N806",   # variable in function should be lowercase — same reason
    "N812",   # lowercase imported as non-lowercase
    "E741",   # ambiguous variable name (l, O, I) — we use these in math context
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Allow longer lines in tests for readability
"arke/agent/prompts.py" = ["E501"]  # System prompt strings are naturally long
"arke/agent/tools_schema.py" = ["E501"]  # JSON schema descriptions are naturally long
"arke/parser/parser.py" = ["N802"]  # Lark transformer methods must match UPPERCASE terminal names

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
